<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070f">
  <title>WAVO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body class="no-video">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="app">
    <aside class="side" id="sidebar">
      <div class="rail">
        <a class="rail-logo" href="#/home" aria-label="WAVO"><img src="/favicon.png" alt=""><span class="rail-name">WAVO</span></a>
        <a class="rail-btn" href="#/home" data-view="home" aria-label="בית">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 10.5V20h12v-9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
        <a class="rail-btn" href="#/search" data-view="search" aria-label="חיפוש">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
        <a class="rail-btn" href="#/library" data-view="library" aria-label="הספרייה">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
      </div>

      <div class="panel">
        <header class="lib-head"><h2>הספרייה שלך</h2></header>
        <label class="lib-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="libFilter" type="search" placeholder="סנן פלייליסטים…" aria-label="סינון פלייליסטים">
        </label>
        <div class="plist" id="playlists"></div>
      </div>
    </aside>

    <main class="content" id="top">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="פתיחת תפריט" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="arrows">
          <button id="back" aria-label="חזרה"><svg viewBox="0 0 24 24" class="flip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button id="fwd" aria-label="קדימה"><svg viewBox="0 0 24 24" class="flip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="מה בא לך לשמוע?" aria-label="חיפוש">
        </label>
        <span class="playing-now" id="playingNow"></span>
        <div class="win-controls" aria-label="בקרות חלון">
          <button class="win-btn win-hide" id="winHide" title="הצג/הסתר" aria-label="הסתר">−</button>
          <button class="win-btn win-full" id="winFull" title="מסך מלא" aria-label="מסך מלא">□</button>
          <button class="win-btn win-close" id="winClose" title="סגור" aria-label="סגור">×</button>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="frame"><div id="ytPlayer"></div></div>
      </section>

      <div class="view" id="view"></div>
    </main>

    <aside class="np" id="np">
      <header class="np-head">
        <button class="np-close" id="npClose" aria-label="סגור">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <h2 id="npBased">WAVO</h2>
      </header>
      <div class="np-body" id="npBody"></div>
    </aside>
  </div>

  <footer class="player">
    <div class="now">
      <img class="mini-cover" id="miniCover" alt="">
      <div class="mini-text">
        <p id="npTitle">בחר שיר</p>
        <p id="npArtist">—</p>
      </div>
      <button class="icon-btn sm heart" id="npLike" aria-label="אהב"></button>
    </div>

    <div class="controls">
      <div class="btns">
        <button class="ctl" id="shuffle" aria-label="אקראי">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4 20 4.5 20.5 10l-5.5-5.5zM4 18.6 18.6 4M10.6 19.4l2.4-2.4M15 19h5.5v-5.5"/></svg>
        </button>
        <button class="ctl" id="prev" aria-label="הקודם">
          <svg viewBox="0 0 24 24" class="flip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6v12M19 6v12l-9-6z"/></svg>
        </button>
        <button class="ctl main" id="toggle" aria-label="הפעל / השהה">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
        </button>
        <button class="ctl" id="next" aria-label="הבא">
          <svg viewBox="0 0 24 24" class="flip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6v12M5 6v12l9-6z"/></svg>
        </button>
        <button class="ctl" id="repeat" aria-label="חזרה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 7h9v3l4-4-4-4v3H5v5h2zm10 10h-9v-3l-4 4 4 4v-3h12v-5h-2z"/></svg>
        </button>
      </div>
      <div class="bar">
        <span id="curTime">0:00</span>
        <div class="track" id="bar"><div class="fill" id="fill"><i></i></div></div>
        <span id="totTime">0:00</span>
      </div>
    </div>

    <div class="extra">
      <button class="ctl sm" id="npBtn" aria-label="לוח ניגון">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15M17 9h1.5M17 12.5h1.5"/></svg>
      </button>
      <button class="ctl sm" id="mute" aria-label="עוצמה">
        <svg viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 17V7L7.5 10z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="track vol" id="volBar"><div class="fill" id="volFill" style="width:70%"><i></i></div></div>
    </div>
  </footer>

  <script src="songs.js?v=11"></script>
  <script src="channels.js?v=11"></script>
  <script src="providers.js?v=11"></script>
  <script src="script.js?v=11"></script>
</body>
</html>
