# Auto-adds newly published songs from the mapped YouTube artist channels.
# Reads each channel's RSS feed + the innertube player API (no API key),
# appends anything missing to public/wavo/songs.js, bumps the cache-bust
# versions, fetches lyrics for just the new videos, and commits to main —
# which triggers pages.yml (PWA) and ios.yml (new IPA) automatically.
name: Auto-add new songs

on:
  schedule:
    - cron: "17 6 * * *" # every day 06:17 UTC = 09:17 Israel
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-add
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan channels and add new songs
        run: node scripts/auto-add-songs.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No new songs."
            exit 0
          fi
          git config user.name "wavo-auto"
          git config user.email "wavo-auto@users.noreply.github.com"
          git add public/wavo/songs.js public/wavo/lyrics src/routes/index.tsx scripts/ios-web.mjs
          git commit -m "chore: auto-add new songs from YouTube channels"
          git push
